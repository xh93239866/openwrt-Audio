<!-- 播放器控件区域 -->
<div class="player-controls-container" role="region" aria-label="播放器控件">
  <div class="player-controls">
    <!-- 当前播放歌曲信息（桌面端） -->
    <div class="current-track-info" id="current-track-info" aria-live="polite">
      <div class="current-track-name" id="current-track-name">未选择歌曲</div>
      <div class="current-track-singer" id="current-track-singer">点击上方列表选择歌曲</div>
    </div>
    <!-- 移动端当前播放歌曲信息 -->
    <div class="mobile-track-info" id="mobile-track-info">
      <div class="mobile-track-name" id="mobile-track-name">未选择歌曲</div>
      <div class="mobile-track-singer" id="mobile-track-singer">点击列表选择歌曲</div>
    </div>

    <!-- 播放进度与时间 -->
    <div class="progress-container" aria-hidden="false">
      <div id="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" tabindex="0">
        <div id="progress-fill" style="width: 0%;"></div>
      </div>
      <div class="time-display">
        <div id="time-current">0:00</div>
        <div id="time-total">0:00</div>
      </div>
    </div>

    <!-- 播放控制按钮组 -->
    <div class="control-buttons" role="toolbar" aria-label="播放控制">
      <button class="control-btn mode-btn" id="prev-btn" title="上一首" aria-label="上一首"><i class="fas fa-backward"></i></button>
      <button class="control-btn" id="play-btn" title="播放" aria-label="播放/暂停"><i class="fas fa-play"></i></button>
      <button class="control-btn" id="pause-btn" title="暂停" aria-label="暂停" style="display:none;"><i class="fas fa-pause"></i></button>
      <button class="control-btn mode-btn" id="next-btn" title="下一首" aria-label="下一首"><i class="fas fa-forward"></i></button>
    </div>

    <!-- 模式与音量 -->
    <div class="mode-and-volume" style="display:flex; justify-content:center; align-items:center; gap:20px;">
      <div class="mode-buttons" role="group" aria-label="播放模式">
        <button class="mode-btn" id="shuffle-btn" title="随机播放" aria-pressed="false"><i class="fas fa-random"></i></button>
        <button class="mode-btn" id="repeat-btn" title="重复" aria-pressed="false"><i class="fas fa-redo"></i></button>
      </div>

      <div class="volume-control" aria-label="音量">
        <i class="fas fa-volume-down" aria-hidden="true"></i>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" aria-label="音量滑块">
      </div>
    </div>
  </div>
</div>
