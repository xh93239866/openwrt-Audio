<!-- 播放器主区域 -->
<div class="player-section">
  <!-- 搜索框 -->
  <div class="search-box">
    <input type="text" id="search-input" placeholder="搜索歌曲/歌手..." autocomplete="off" aria-label="搜索歌曲或歌手">
    <button id="search-btn" aria-label="搜索"><i class="fas fa-search" aria-hidden="true"></i> 搜索</button>
    <button id="refresh-btn" title="刷新音乐列表" aria-label="刷新列表"><i class="fas fa-sync-alt" aria-hidden="true"></i> 刷新</button>
  </div>
  <!-- 状态提示 -->
  <div id="status-message" class="status-message" style="display: none;" role="status" aria-live="polite"></div>
  <!-- 音乐列表标题 -->
  <div class="music-list-header">
    <div class="list-title" id="list-title">全部音乐</div>
    <div class="list-count" id="list-count">0 首歌曲</div>
  </div>
  <!-- 音乐列表 -->
  <div class="music-list" id="music-list" role="list" aria-label="音乐列表"></div>
</div>
